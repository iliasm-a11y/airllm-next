name: GLM native integration controls
on:
  push:
    paths:
      - 'air_llm/airllm/nextgen/glm_native.py'
      - 'air_llm/airllm/auto_model.py'
      - 'tests_next/test_glm_native*.py'
      - 'integrations/ronin/**'
      - 'research/glm53_m5/**'
      - 'research/glm53_ultra/**'
      - 'research/glm53_shared_prefill/**'
      - 'research/glm53_batched_prefill/**'
      - 'research/glm53_gpu_v3/**'
      - 'research/glm53_gpu_v2/placement.py'
      - '.github/workflows/glm-native.yml'
  pull_request:
    paths:
      - 'air_llm/airllm/nextgen/glm_native.py'
      - 'air_llm/airllm/auto_model.py'
      - 'tests_next/test_glm_native*.py'
      - 'integrations/ronin/**'
      - 'research/glm53_m5/**'
      - 'research/glm53_ultra/**'
      - 'research/glm53_shared_prefill/**'
      - 'research/glm53_batched_prefill/**'
      - 'research/glm53_gpu_v3/**'
      - 'research/glm53_gpu_v2/placement.py'
      - '.github/workflows/glm-native.yml'
permissions:
  contents: read
jobs:
  portable-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4 pytest==9.1.1 psutil==7.2.2
      - run: python tests_next/test_glm_native.py
      - run: python tests_next/test_glm_native_exit.py
      - run: python -m unittest discover -s integrations/ronin/tests -v
      - run: python -m unittest discover -s research/glm53_shared_prefill -p 'test_*.py' -v
      - run: python -m pytest --noconftest --capture=sys -q research/glm53_batched_prefill
      - run: python -m unittest discover -s research/glm53_ultra -p 'test_*.py' -v
      - run: python -m pytest --noconftest --capture=sys -q research/glm53_ultra/test_prefetch_compare.py
      - run: python -m unittest research.glm53_gpu_v3.test_campaign -v
      - run: python -m pytest --noconftest --capture=sys -q research/glm53_m5/test_compare_fidelity.py research/glm53_m5/test_benchmark_two_slots.py
      - run: python -m py_compile benchmarks/benchmark_glm_native.py research/glm53_m5/build_runtime.py research/glm53_m5/run_guarded_probe.py research/glm53_m5/summarize_results.py
      # Real checkpoint, Metal, latency and memory qualification are local evidence.
