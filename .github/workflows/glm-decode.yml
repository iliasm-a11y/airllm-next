name: GLM decode research controls
on:
  push:
    paths:
      - 'research/glm53_ultra_decode/**'
      - '.github/workflows/glm-decode.yml'
  pull_request:
    paths:
      - 'research/glm53_ultra_decode/**'
      - '.github/workflows/glm-decode.yml'
permissions:
  contents: read
jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4 pytest==9.1.1 psutil==7.2.2
      - run: PYTHONPATH=.:air_llm python -m pytest --noconftest --capture=sys -q research/glm53_ultra_decode
      # Native Metal/components and full checkpoint admission are local evidence.
